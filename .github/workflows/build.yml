name: Build & Dependency Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      
      - name: Check for missing dependencies
        id: check_deps
        run: |
          python -c "
          import ast
          import sys
          
          # Parse the Python file
          with open('weather_assistant.py', 'r') as f:
              tree = ast.parse(f.read())
          
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      imports.add(alias.name.split('.')[0])
              elif isinstance(node, ast.ImportFrom):
                  if node.module:
                      imports.add(node.module.split('.')[0])
          
          # Check which imports are available
          missing = []
          for imp in imports:
              if imp not in ['asyncio', 'sys', 'random']:  # stdlib
                  try:
                      __import__(imp)
                  except ImportError:
                      missing.append(imp)
          
          if missing:
              print(f'MISSING_DEPS={\" \".join(missing)}')
              sys.exit(1)
          "
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Run linting
        continue-on-error: true
        run: |
          pip install pylint
          pylint weather_assistant.py || true
      
      - name: Trigger self-healing if needed
        if: failure() && steps.check_deps.outcome == 'failure'
        run: |
          echo "Dependencies missing - self-healing workflow will be triggered"
          
  upload-logs:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v3
      - name: Save build logs
        run: echo "Build completed at $(date)" > build.log
