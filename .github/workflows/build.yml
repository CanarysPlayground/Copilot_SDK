name: Build & Dependency Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      missing_deps: ${{ steps.check_deps.outputs.missing_deps }}
      has_missing: ${{ steps.check_deps.outputs.has_missing }}
      pr_number: ${{ github.event.pull_request.number }}
      branch_name: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      
      - name: Check for missing dependencies
        id: check_deps
        run: |
          python << 'PYTHON_EOF'
          import ast
          import sys
          
          with open('weather_assistant.py', 'r') as f:
              tree = ast.parse(f.read())
          
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      imports.add(alias.name.split('.')[0])
              elif isinstance(node, ast.ImportFrom):
                  if node.module:
                      imports.add(node.module.split('.')[0])
          
          missing = []
          for imp in imports:
              if imp not in ['asyncio', 'sys', 'random']:
                  try:
                      __import__(imp)
                  except ImportError:
                      missing.append(imp)
          
          if missing:
              print(f"::set-output name=missing_deps::{','.join(missing)}")
              print(f"::set-output name=has_missing::true")
              sys.exit(1)
          else:
              print(f"::set-output name=has_missing::false")
          PYTHON_EOF
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Run linting
        continue-on-error: true
        run: |
          pip install pylint
          pylint weather_assistant.py || true
      
      - name: Trigger self-healing if needed
        if: failure() && steps.check_deps.outcome == 'failure'
        run: |
          echo "Dependencies missing - self-healing workflow will be triggered"
          
  upload-logs:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v3
      - name: Save build logs
        run: echo "Build completed at $(date)" > build.log

  trigger-healing:
    needs: build
    if: needs.build.outputs.has_missing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger self-healing workflow
        run: |
          echo "Missing dependencies detected: ${{ needs.build.outputs.missing_deps }}"
          echo "PR Number: ${{ needs.build.outputs.pr_number }}"
          echo "Self-healing workflow will be triggered..."
