name: Self-Healing Workflow

on:
  workflow_run:
    workflows: ["Build & Dependency Check"]
    types: [completed]

jobs:
  self-heal:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Analyze and fix dependencies
        id: heal
        run: |
          python << 'PYTHON_EOF'
          import ast
          import subprocess
          import sys
          
          with open('weather_assistant.py', 'r') as f:
              tree = ast.parse(f.read())
          
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      imports.add(alias.name.split('.')[0])
              elif isinstance(node, ast.ImportFrom):
                  if node.module:
                      imports.add(node.module.split('.')[0])
          
          mapping = {
              'copilot': 'copilot-client',
              'pydantic': 'pydantic',
              'requests': 'requests'
          }
          
          missing = []
          for imp in imports:
              if imp not in ['asyncio', 'sys', 'random']:
                  try:
                      __import__(imp)
                  except ImportError:
                      missing.append(mapping.get(imp, imp))
          
          if missing:
              print(f"Missing: {missing}")
              for pkg in missing:
                  subprocess.run([sys.executable, '-m', 'pip', 'install', pkg], check=True)
              
              result = subprocess.run([sys.executable, '-m', 'pip', 'freeze'], 
                                    capture_output=True, text=True)
              
              with open('requirements.txt', 'w') as f:
                  for line in result.stdout.strip().split('\n'):
                      if any(s in line.lower() for s in missing + ['pydantic', 'requests', 'copilot']):
                          f.write(line + '\n')
              
              print(f"::set-output name=healed::true")
              print(f"::set-output name=missing_deps::{','.join(missing)}")
          else:
              print(f"::set-output name=healed::false")
          PYTHON_EOF

      - name: Validate Python syntax
        if: steps.heal.outputs.healed == 'true'
        run: |
          python -m py_compile weather_assistant.py

      - name: Create healing branch and PR
        if: steps.heal.outputs.healed == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const branch = `fix/dependencies-${Date.now()}`;
            
            // Get current commit
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            
            const baseCommitSha = ref.object.sha;
            
            // Read requirements.txt
            const reqContent = fs.readFileSync('requirements.txt', 'utf8');
            
            // Create blob for requirements.txt
            const { data: blob } = await github.rest.git.createBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: reqContent,
              encoding: 'utf-8'
            });
            
            // Create tree
            const { data: tree } = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: baseCommitSha,
              tree: [
                {
                  path: 'requirements.txt',
                  mode: '100644',
                  type: 'blob',
                  sha: blob.sha
                }
              ]
            });
            
            // Create commit
            const { data: commit } = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: '🔧 Self-heal: Fix missing dependencies\n\nMissing: ${{ steps.heal.outputs.missing_deps }}',
              tree: tree.sha,
              parents: [baseCommitSha]
            });
            
            // Create ref (branch)
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${branch}`,
              sha: commit.sha
            });
            
            // Create PR
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔧 Self-Heal: Add missing dependencies',
              body: `## Auto-generated self-healing PR\n\n**Missing dependencies detected:** ${{ steps.heal.outputs.missing_deps }}\n\nThis PR automatically fixes the missing dependencies found in the build.\n\n- ✅ Installed missing packages\n- ✅ Updated requirements.txt\n- ✅ Validated Python syntax`,
              head: branch,
              base: 'main'
            });
            
            console.log(`Created PR #${pr.number}`);
