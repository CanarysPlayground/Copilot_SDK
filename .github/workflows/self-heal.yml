name: Self-Healing Workflow

on:
  workflow_run:
    workflows: ["Build & Dependency Check"]
    types: [completed]
  pull_request:
    branches: [ main ]

jobs:
  self-heal:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' || github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Analyze and fix dependencies
        id: heal
        continue-on-error: true
        run: |
          python -c "
          import ast
          import subprocess
          import sys
          import re
          
          # Parse the Python file to extract imports
          with open('weather_assistant.py', 'r') as f:
              tree = ast.parse(f.read())
          
          imports = {}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      pkg_name = alias.name.split('.')[0]
                      imports[pkg_name] = pkg_name
              elif isinstance(node, ast.ImportFrom):
                  if node.module:
                      pkg_name = node.module.split('.')[0]
                      imports[pkg_name] = pkg_name
          
          # Map import names to package names (handle special cases)
          mapping = {
              'copilot': 'copilot-client',
              'pydantic': 'pydantic',
              'requests': 'requests'
          }
          
          # Check and install missing packages
          missing = []
          for imp in imports:
              if imp not in ['asyncio', 'sys', 'random']:  # stdlib
                  try:
                      __import__(imp)
                  except ImportError:
                      missing.append(mapping.get(imp, imp))
          
          if missing:
              print(f'Installing missing packages: {missing}')
              for pkg in missing:
                  subprocess.run([sys.executable, '-m', 'pip', 'install', pkg], check=True)
              
              # Update requirements.txt
              result = subprocess.run([sys.executable, '-m', 'pip', 'freeze'], 
                                    capture_output=True, text=True)
              
              # Read current requirements.txt
              try:
                  with open('requirements.txt', 'r') as f:
                      current_reqs = f.read()
              except:
                  current_reqs = ''
              
              # Get frozen packages
              installed = result.stdout.strip().split('\n')
              
              # Update requirements
              with open('requirements.txt', 'w') as f:
                  for line in installed:
                      if any(pkg.lower() in line.lower() or line.lower().startswith(pkg.lower()) 
                             for pkg in missing + ['pydantic', 'requests', 'copilot']):
                          f.write(line + '\n')
                  # Add any existing requirements that weren't in freeze
                  for line in current_reqs.split('\n'):
                      if line.strip() and not any(pkg.lower() in line.lower() for pkg in missing):
                          f.write(line + '\n')
              
              print('Updated requirements.txt')
              print(f'::set-output name=healed::true')
          else:
              print('No missing dependencies found')
              print(f'::set-output name=healed::false')
          "
      
      - name: Regenerate requirements.txt
        if: steps.heal.outputs.healed == 'true'
        run: |
          python -m pip install -r requirements.txt --upgrade || true
          pip freeze | grep -E '(requests|pydantic|copilot)' > requirements_temp.txt
          cat requirements_temp.txt >> requirements.txt || true
          rm -f requirements_temp.txt
      
      - name: Validate Python syntax
        run: |
          python -m py_compile weather_assistant.py
      
      - name: Commit and push changes
        if: steps.heal.outputs.healed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Self-Healing Bot"
          git add requirements.txt
          git commit -m "🔧 self-heal: Added missing dependencies" || echo "No changes to commit"
          git push origin HEAD:${{ github.head_ref }} || echo "No changes to push"
        continue-on-error: true
      
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 Self-healing workflow completed!\n\n✅ Checked and fixed missing dependencies\n✅ Validated Python syntax\n✅ Updated requirements.txt'
            })
